<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account — Nexa</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<nav class="navbar">
  <a href="../index.html" class="logo">
    <div class="logo-icon">✦</div>
    <span class="logo-text">Nexa</span>
  </a>
</nav>

<div class="auth-container">
  <div class="auth-box">
    <h2>Create your account</h2>
    <p class="subtitle">Join the Nexa community today</p>

    <div class="error-msg" id="errorMsg"></div>
    <div class="success-msg" id="successMsg"></div>

    <form id="registerForm">
      <div class="form-group">
        <label>Username</label>
        <input type="text" id="username" required placeholder="yourname">
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" required placeholder="you@example.com">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" required placeholder="At least 6 characters" minlength="6">
      </div>
      <button type="submit" class="btn btn-primary btn-full btn-lg" id="submitBtn">Create Account</button>
    </form>

    <div class="auth-footer">
      Already have an account? <a href="login.html">Sign in</a>
    </div>
  </div>
</div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase-config.js"></script>
<script src="../js/auth.js"></script>
<script>
redirectIfLoggedIn();

document.getElementById("registerForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const errorMsg = document.getElementById("errorMsg");
  const successMsg = document.getElementById("successMsg");
  const submitBtn = document.getElementById("submitBtn");
  errorMsg.style.display = "none";
  successMsg.style.display = "none";

  const username = document.getElementById("username").value.trim();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  submitBtn.textContent = "Creating account...";
  submitBtn.disabled = true;

  const { data, error } = await supabaseClient.auth.signUp({
    email,
    password,
    options: { data: { username } }
  });

  if (error) {
    errorMsg.textContent = error.message;
    errorMsg.style.display = "block";
    submitBtn.textContent = "Create Account";
    submitBtn.disabled = false;
    return;
  }

  if (data.user) {
    await supabaseClient.from("profiles").upsert({
      id: data.user.id,
      username: username,
      email: email,
    });
  }

  if (data.session) {
    successMsg.textContent = "Account created! Redirecting...";
    successMsg.style.display = "block";
    window.location.href = "feed.html";
  } else {
    successMsg.textContent = "Account created! Please check your email to confirm, then sign in.";
    successMsg.style.display = "block";
    submitBtn.textContent = "Create Account";
    submitBtn.disabled = false;
  }
});
</script>

</body>
</html>
