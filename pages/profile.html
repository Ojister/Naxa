<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile — Nexa</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<nav class="navbar">
  <a href="../index.html" class="logo">
    <div class="logo-icon">✦</div>
    <span class="logo-text">Nexa</span>
  </a>
</nav>

<div class="app-content" style="padding-bottom: 90px;">
  <div class="profile-header">
    <div class="profile-avatar" id="profileAvatar">?</div>
    <div style="font-size:20px; font-weight:700;" id="profileName">Loading...</div>
    <div style="color:var(--text-secondary); font-size:14px;" id="profileEmail"></div>
    <div class="stats-row">
      <div class="stat"><div class="stat-num" id="postCount">0</div><div class="stat-label">Posts</div></div>
      <div class="stat"><div class="stat-num">0</div><div class="stat-label">Followers</div></div>
      <div class="stat"><div class="stat-num">0</div><div class="stat-label">Following</div></div>
    </div>
  </div>

  <div class="card" style="margin-bottom:12px;">
    <a href="monetization.html" style="display:flex; justify-content:space-between; align-items:center;">
      <span>💰 Monetization <span class="demo-badge">DEMO</span></span> <span>›</span>
    </a>
  </div>
  <div class="card" style="margin-bottom:12px;">
    <a href="payments.html" style="display:flex; justify-content:space-between; align-items:center;">
      <span>💳 Payments <span class="demo-badge">DEMO</span></span> <span>›</span>
    </a>
  </div>
  <div class="card" style="margin-bottom:12px;">
    <a href="live.html" style="display:flex; justify-content:space-between; align-items:center;">
      <span>📡 Live Streaming <span class="demo-badge">DEMO</span></span> <span>›</span>
    </a>
  </div>
  <div class="card" style="margin-bottom:20px;">
    <a href="reels.html" style="display:flex; justify-content:space-between; align-items:center;">
      <span>🎬 Reels <span class="demo-badge">DEMO</span></span> <span>›</span>
    </a>
  </div>

  <button class="btn btn-outline btn-full" id="logoutBtn">Log Out</button>
</div>

<nav class="bottom-nav" id="bottomNav"></nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase-config.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/bottom-nav.js"></script>
<script>
async function init() {
  const user = await requireAuth();
  if (!user) return;
  renderBottomNav("profile");

  const profile = await ensureProfile(user);
  document.getElementById("profileName").textContent = profile.username || "User";
  document.getElementById("profileEmail").textContent = user.email;
  document.getElementById("profileAvatar").textContent = getInitials(profile.username || user.email);

  const { count } = await supabaseClient
    .from("posts")
    .select("*", { count: "exact", head: true })
    .eq("user_id", user.id);
  document.getElementById("postCount").textContent = count || 0;
}

document.getElementById("logoutBtn").addEventListener("click", logout);

init();
</script>

</body>
</html>
