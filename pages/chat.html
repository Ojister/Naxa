<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Messages — Nexa</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<nav class="navbar">
  <a href="../index.html" class="logo">
    <div class="logo-icon">✦</div>
    <span class="logo-text">Nexa</span>
  </a>
  <span style="font-size:13px; color:var(--text-secondary);">Community Room</span>
</nav>

<div class="app-content" style="padding-bottom: 90px;">
  <div class="chat-container">
    <div class="chat-messages" id="chatMessages">
      <div class="loading-spinner"></div>
    </div>
    <form class="chat-input-bar" id="chatForm">
      <input type="text" id="chatInput" placeholder="Type a message..." autocomplete="off">
      <button type="submit" class="send-btn">➤</button>
    </form>
  </div>
</div>

<nav class="bottom-nav" id="bottomNav"></nav><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase-config.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/bottom-nav.js"></script>
<script>
let currentUser = null;
const messagesEl = document.getElementById("chatMessages");

async function init() {
  currentUser = await requireAuth();
  if (!currentUser) return;
  renderBottomNav("chat");
  await loadMessages();
  setInterval(loadMessages, 3000);
}

async function loadMessages() {
  const { data, error } = await supabaseClient
    .from("messages")
    .select("*, profiles(username)")
    .order("created_at", { ascending: true })
    .limit(100);

  if (error) {
    messagesEl.innerHTML = `<div class="empty-state">Could not load messages: ${error.message}</div>`;
    return;
  }

  if (!data || data.length === 0) {
    messagesEl.innerHTML = `<div class="empty-state">No messages yet. Say hello!</div>`;
    return;
  }

  const wasAtBottom = messagesEl.scrollTop + messagesEl.clientHeight >= messagesEl.scrollHeight - 40;

  messagesEl.innerHTML = data.map(m => {
    const mine = m.user_id === currentUser.id;
    const author = m.profiles?.username || "Unknown";
    const label = mine ? "" : `<div style="font-size:11px; color:var(--text-secondary); margin-bottom:2px;">${escapeHtml(author)}</div>`;
    return `<div class="msg ${mine ? 'mine' : 'theirs'}">${label}${escapeHtml(m.content)}</div>`;
  }).join("");

  if (wasAtBottom) {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

document.getElementById("chatForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const input = document.getElementById("chatInput");
  const text = input.value.trim();
  if (!text) return;

  input.value = "";
  const { error } = await supabaseClient.from("messages").insert({
    user_id: currentUser.id,
    content: text,
  });

  if (!error) await loadMessages();
});

init();
</script>

</body>
</html>
