<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Chat — Nexa</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<nav class="navbar">
  <a href="../index.html" class="logo">
    <div class="logo-icon">✦</div>
    <span class="logo-text">Nexa</span>
  </a>
  <span class="demo-badge">DEMO AI</span>
</nav>

<div class="app-content" style="padding-bottom: 90px;">
  <div class="chat-container">
    <div class="chat-messages" id="chatMessages">
      <div class="msg theirs">Hi! I'm the Nexa AI Assistant. Ask me anything — note this is a simulated demo assistant, not connected to a real AI model yet.</div>
    </div>
    <form class="chat-input-bar" id="chatForm">
      <input type="text" id="chatInput" placeholder="Type a message..." autocomplete="off">
      <button type="submit" class="send-btn">➤</button>
    </form>
  </div>
</div>

<nav class="bottom-nav" id="bottomNav"></nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase-config.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/bottom-nav.js"></script>
<script>
(async () => {
  const user = await requireAuth();
  if (!user) return;
  renderBottomNav("ai-chat");
})();

const replies = [
  "That's a great question! Let me think about that.",
  "Interesting — here's a simulated response since this demo isn't wired to a real AI model yet.",
  "I'd love to help with that. In the full version, this would connect to a real AI API.",
  "Good point! What else would you like to explore?",
  "Here's some food for thought on that topic...",
];

const messagesEl = document.getElementById("chatMessages");

document.getElementById("chatForm").addEventListener("submit", (e) => {
  e.preventDefault();
  const input = document.getElementById("chatInput");
  const text = input.value.trim();
  if (!text) return;

  addMsg(text, "mine");
  input.value = "";

  setTimeout(() => {
    const reply = replies[Math.floor(Math.random() * replies.length)];
    addMsg(reply, "theirs");
  }, 600);
});

function addMsg(text, cls) {
  const div = document.createElement("div");
  div.className = `msg ${cls}`;
  div.textContent = text;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}
</script>

</body>
</html>
